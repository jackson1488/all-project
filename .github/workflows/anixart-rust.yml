name: Anixart Rust CI (Linux)

on:
  push:
    branches: [ main ]
    paths: [ "anixart/**", ".github/workflows/anixart-rust.yml" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: anixart

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libxkbcommon / wayland / x11 headers: iced 0.13 -> winit 0.30 windowing
          # backends. mpv: the player the app shells out to for playback.
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev pkg-config mpv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anixart
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: anixart-linux
          path: |
            anixart/target/release/anixart
            !anixart/target/release/*.d
            !anixart/target/release/*.rlib
          if-no-files-found: ignore
