name: Anixart Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install mpv
      run: sudo apt-get update && sudo apt-get install -y mpv
    - name: Build
      run: |
        cd anixart
        cargo build --verbose
    - name: Run tests
      run: |
        cd anixart
        cargo test --verbose
    - name: Clippy
      run: |
        cd anixart
        cargo clippy -- -D warnings
