name: Anixart Rust (Linux)

on:
  push:
    branches: [ main ]
    paths: [ "anixart/**", ".github/workflows/anixart-rust.yml" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: anixart

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev mpv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anixart
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: anixart-linux
          path: |
            anixart/target/release/anixart
            !anixart/target/release/*.d
            !anixart/target/release/*.rlib
          if-no-files-found: ignore
