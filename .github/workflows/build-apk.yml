name: Build Neongram Kotlin Android APK (Cloud CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: neongram-kotlin-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build Neongram Kotlin APK in Cloud (Zero Local PC Load)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle 8.14 & Cloud Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: 🔑 Cache persistent Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: neongram-kotlin-debug-keystore-v1

      - name: 🛠️ Build Debug APK (arm64-v8a)
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 🔍 Verify Built APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::APK file not found!"
            exit 1
          fi
          echo "Successfully built APK: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: 📦 Upload Neongram Kotlin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neongram-kotlin-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
