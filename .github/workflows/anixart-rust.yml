name: Anixart Rust CI (Linux + Windows)

on:
  push:
    branches: [ main ]
    paths: [ "anixart/**", ".github/workflows/anixart-rust.yml" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: anixart

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libxkbcommon / wayland / x11 headers: iced 0.13 -> winit 0.30 windowing
          # backends. mpv: the player the app shells out to for playback.
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev pkg-config mpv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anixart
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: anixart-linux
          path: |
            anixart/target/release/anixart
            !anixart/target/release/*.d
            !anixart/target/release/*.rlib
          if-no-files-found: ignore

  # Experimental Windows parity check. The app spawns an external `mpv` process
  # instead of linking libmpv, so no C deps are needed here — only the MSVC
  # toolchain. `continue-on-error` keeps this informational: it reports Windows
  # portability status without ever gating the run. Promote it to a blocking
  # gate once every step is green (see the Windows roadmap in anixart/README.md).
  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anixart
      # Advisory only on purpose: no `-D warnings`, so pre-existing platform
      # lints are reported as warnings instead of failing the parity probe.
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: anixart-windows
          path: |
            anixart/target/release/anixart.exe
            !anixart/target/release/*.d
            !anixart/target/release/*.lib
            !anixart/target/release/*.pdb
          if-no-files-found: ignore
