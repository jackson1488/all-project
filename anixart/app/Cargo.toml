[package]
name = "anixart"
version = "0.1.0"
edition = "2021"

[dependencies]
anixart-core = { path = "../core" }
anixart-parsers = { path = "../parsers" }
# iced 0.13 -> winit 0.30 + wayland-client 0.31: modern Wayland/X11 support,
# which fixes the `wl_surface has no event 2` crash of iced 0.4 on Fedora Wayland.
# The `tokio` feature is mandatory: without an async feature iced falls back to the
# "null" backend that silently drops every Task, so reqwest calls would never run.
# NOTE: iced 0.13 has no `wayland`/`x11` features (those only exist since 0.14);
# winit 0.30 enables both Linux backends by default, so `tokio` is all we need.
iced = { version = "0.13", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Social login: `urlencoding` builds the browser authorize URLs and decodes the
# loopback callback payload, `serde_json` reads/writes the persisted session
# (~/.config/anixart-linux/session.json).
urlencoding = "2"
serde_json = "1"
# 1-click Google sign-in: `tokio::net` runs the loopback callback listener that
# catches the browser redirect, `tokio::time` bounds the wait. iced already drives
# a tokio runtime (its `tokio` feature), so no second executor is introduced.
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }

[lib]
name = "anixart_app"
path = "src/lib.rs"

[[bin]]
name = "anixart"
path = "src/main.rs"
